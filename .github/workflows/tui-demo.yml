# TUI 不属于根 workspace，单独守住三平台格式、clippy 与测试。
name: TUI demo
on:
  push:
    branches: ["step/**", "proto/tui-demo"]
    paths: ["tui-demo/**", "crates/**", "resources/**", ".github/workflows/tui-demo.yml"]
  workflow_dispatch:
jobs:
  check:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: 装上指定工具链
        run: rustup toolchain install
      - name: 格式
        run: cargo fmt --manifest-path tui-demo/Cargo.toml --check
      - name: clippy
        run: cargo clippy --manifest-path tui-demo/Cargo.toml --all-targets -- -D warnings
      - name: TUI 测试
        run: cargo test --manifest-path tui-demo/Cargo.toml
