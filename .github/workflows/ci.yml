# 三平台 CI：每台机器跑 cargo xtask check，和本地验收是同一条命令；另有一项长跑，只在 Linux 上。
# 为什么这样定，见 docs/construction/0-3-三平台CI.md；2026-10-08 提速（缓存、长跑只编有长跑测试的两个 crate）见
# docs/construction/0-3-三平台CI（补）.md。
name: CI

on:
  push:
    branches: [main, "step/**"]
  workflow_dispatch:

permissions:
  contents: read

# 每项最多跑 45 分钟：测试卡住时（例如会话 actor 的测试等一个不会来的回应），不白等 GitHub 默认的六个小时
# （施工 3-7 中）。原来是 30 分钟，2026-10-07 项目主人定改成 45：Windows 平时要 28、29 分钟，长跑 20 到 29 分钟，
# 几个分支同时排队时卡在线上被取消。
jobs:
  check:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Linux 钉 24.04：发行构建以 glibc 2.39 为基线（12-进程形态与分发 R11）。
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: 装上 rust-toolchain.toml 钉住的工具链
        run: rustup toolchain install
      # 第三方依赖的编译产物：照 Cargo.lock、工具链、这台机器的系统分开存；只有 main 上的那一次存，分支照 main 的取，
      # 缓存不随分支越攒越多。工作区自己的 crate 每次照旧编。
      - name: 取编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: 门禁
        run: cargo xtask check

  # 长跑：随机测试接着平时的往后跑两万例（照 niri 的 randomized-tests，施工 2-10）。平时的
  # cargo test 和本地门禁跳过这几个 #[ignore] 的测试；纯逻辑不碰平台，只在 Linux 上、release 模式跑。
  # 只编有长跑测试的两个 crate、只跑名字以 for_longer 结尾的（2026-10-08）：原来 release 编整个工作区要 38 分钟，
  # 测试本身不到 2 分钟；别的 #[ignore] 是量尺、要外网、要虚拟机的，在这里跑了也白跑。新加长跑测试照这个名字、
  # 放在别的 crate 里的，把 crate 加进下面这一行。
  randomized:
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: 装上 rust-toolchain.toml 钉住的工具链
        run: rustup toolchain install
      - name: 取编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: 长跑
        run: cargo test --release -p miyu-kernel -p miyu-assemble -- --ignored for_longer
