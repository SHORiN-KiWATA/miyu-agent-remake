# 三平台 CI：每台机器跑 cargo xtask check，和本地验收是同一条命令；另有一项长跑，只在 Linux 上。
# 为什么这样定，见 docs/construction/0-3-三平台CI.md。
name: CI

on:
  push:
    branches: [main, "step/**"]
  workflow_dispatch:

permissions:
  contents: read

# 每项最多跑 45 分钟：测试卡住时（例如会话 actor 的测试等一个不会来的回应），不白等 GitHub 默认的六个小时
# （施工 3-7 中）。原来是 30 分钟，2026-10-07 项目主人定改成 45：Windows 平时要 28、29 分钟，长跑 20 到 29 分钟，
# 几个分支同时排队时卡在线上被取消。
jobs:
  check:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Linux 钉 24.04：发行构建以 glibc 2.39 为基线（12-进程形态与分发 R11）。
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: 装上 rust-toolchain.toml 钉住的工具链
        run: rustup toolchain install
      - name: 门禁
        run: cargo xtask check

  # 长跑：随机测试接着平时的往后跑两万例（照 niri 的 randomized-tests，施工 2-10）。平时的
  # cargo test 和本地门禁跳过这几个 #[ignore] 的测试；纯逻辑不碰平台，只在 Linux 上、release 模式跑。
  randomized:
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: 装上 rust-toolchain.toml 钉住的工具链
        run: rustup toolchain install
      - name: 长跑
        run: cargo test --release --workspace -- --ignored
