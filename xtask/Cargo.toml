[package]
name = "xtask"
description = "Miyu 的门禁：cargo xtask check；开发用的 cargo xtask dev-home"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# 只用来读 cargo metadata 的输出。
serde_json = "1.0"
# 登记簿的指纹：资源文件字节的 SHA-256（`docs/designs/26-提示词.md` 第十节）。版本和内核的一样。
sha2 = { version = "0.11", default-features = false }

# `cargo xtask dev-home`（施工 8-6）：照核心的写法建数据根的骨架。
miyu-store = { path = "../crates/miyu-store" }
# `cargo xtask package-web`（施工 W-11）：发布前检查照网页软件自己的读法读 `web.json`，不另写一份规则。
miyu-web = { path = "../crates/miyu-web" }

[lints]
workspace = true
