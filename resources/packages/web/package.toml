# 网页界面的软件包清单（施工 9-1 上，docs/blueprint/packages.md）。给人看的字，不发给模型。

[package]
kind = "ui"
protocol = [1, 1]
name = { en = "Web interface", zh = "网页界面", ja = "ウェブ画面" }
summary = { en = "Chat with the AI and change settings in the browser", zh = "在浏览器里和 AI 对话、改配置", ja = "ブラウザで会話し、設定を変える" }

[command]
name = "web"
program = "miyu-web"
about = { en = "Start the web interface", zh = "打开网页界面", ja = "ウェブ画面を開く" }

[ui]
pages_dir = "web/pages"

[settings.port]
type = "int"
min = 1
max = 65535
default = 8300
layers = ["system"]
name = { en = "Web port", zh = "网页的端口", ja = "ウェブのポート" }
description = { en = "Which local port the web interface listens on.", zh = "网页界面听本机的哪个端口。", ja = "ウェブ画面が待ち受けるローカルのポート。" }

[settings.idle_seconds]
type = "int"
min = 1
max = 86400
default = 600
layers = ["system"]
hidden = true
name = { en = "Idle seconds", zh = "空闲多久退出（秒）", ja = "待機して終了するまで（秒）" }
description = { en = "Quit after this many seconds with no browser connected and no media being served.", zh = "没有浏览器连着、没有媒体在给，连续这么多秒就退出。", ja = "ブラウザがつながっておらずメディアも送っていない状態がこの秒数続いたら終了します。" }

[settings.ticket_idle_seconds]
type = "int"
min = 1
max = 2592000
default = 43200
layers = ["system"]
hidden = true
name = { en = "Media ticket idle seconds", zh = "媒体票据多久作废（秒）", ja = "メディアチケットの有効期限（秒）" }
description = { en = "A /media ticket unused for this many seconds stops working.", zh = "/media 的票据这么多秒没用过就作废。", ja = "/media のチケットはこの秒数使われないと無効になります。" }

[settings.most_tickets]
type = "int"
min = 1
max = 1000000
default = 4096
layers = ["system"]
hidden = true
name = { en = "Most media tickets", zh = "最多几张媒体票据", ja = "メディアチケットの上限" }
description = { en = "At most this many /media tickets; the one unused longest goes first.", zh = "/media 的票据最多几张，满了丢最久没用的。", ja = "/media のチケットの上限。いっぱいになると一番長く使われていないものから捨てます。" }
