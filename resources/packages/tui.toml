# 终端界面的软件包清单（施工 9-1 上，`docs/blueprint/packages.md`）：核心照它列出这个包、找它的程序和认的页。
[package]
kind = "ui"
version = "0.0.1"
protocol = [1, 1]
name = { en = "Terminal interface", zh = "终端界面", ja = "ターミナル画面" }
summary = { en = "Chat with her, watch what she does and change settings in the terminal", zh = "在终端里和她对话、看她做事、改配置", ja = "ターミナルで会話し、作業の様子を見て、設定を変える" }

[command]
name = "tui"
program = "miyu-tui"
about = { en = "Open the terminal interface", zh = "打开终端界面", ja = "ターミナル画面を開く" }

[ui]
opens = ["config"]
