# 网页界面的软件包清单（施工 9-1 上，docs/blueprint/packages.md）。给人看的字，不发给模型。

[package]
kind = "ui"
protocol = [1, 1]
name = { en = "Web interface", zh = "网页界面", ja = "ウェブ画面" }
summary = { en = "Chat with her and change settings in the browser", zh = "在浏览器里和她对话、改配置", ja = "ブラウザで会話し、設定を変える" }

[command]
name = "web"
program = "miyu-web"
about = { en = "Start the web interface", zh = "打开网页界面", ja = "ウェブ画面を開く" }

[ui]
pages_dir = "web/pages"
