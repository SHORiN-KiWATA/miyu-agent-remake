# 接入QQ 的软件包清单（名字 2026-10-09 项目主人定，原来叫 QQ 桥；施工 O-18，docs/blueprint/onebot.md 第一条、packages.md）：核心照开关拉起桥、经标准输入输出说协议；
# miyu onebot … 转交给 miyu-onebot …。给人看的字，不发给模型。

[package]
kind = "process"
protocol = [1, 1]
name = { en = "Connect QQ", zh = "接入QQ", ja = "QQ接続" }
summary = { en = "Talk with her on QQ through NapCat", zh = "经 NapCat 在 QQ 上和她说话", ja = "NapCat 経由で QQ で会話する" }

[command]
name = "onebot"
program = "miyu-onebot"
about = { en = "Start, stop and look at Connect QQ", zh = "开、关、查看接入QQ", ja = "QQ接続を起動・停止・確認する" }

[process]
args = ["serve"]
start = "manual"
# 要的扩展能力（施工 9-4 下上，05-内核接口.md 第三节）：venue.session、session.send、session.respond 是操作会话，带 as 是代
# 平台上的人发话，subscribe 是读会话，events.append 记 ext.onebot.*、venue.* 是写事件（施工 O-23），开本机的两个端口、NapCat
# 连进来是联网。出厂的包算批过的，不用人批。
capabilities = ["sessions.drive", "act_for_external", "events.read", "events.write", "network"]
# 自己的系统账号 onebot（施工 O-4 下，06-多用户与身份.md U14）：群、陌生人私聊的场所会话归它，桥以它的身份连进来。
system_account = true

# 平台接入（施工 F-2，设计 30 第五节）：接入本身（开关、配置项）在头的接入页，不进预设。它登记的平台工具是一个功能「QQ 工具」，
# 照 18 Q16 归预设管（F-3）：只有这一个功能，桥登记的工具都归它。
[connection]
platform = "qq"

[features.qq]
name = { en = "QQ tools", zh = "QQ 工具", ja = "QQ ツール" }

# 桥的配置（施工 O-20，docs/blueprint/onebot.md 第一条「软件包清单」）：O-8 起由核心替桥声明（OnebotSettings），这一步挪过来。
# 都只能写系统配置、当场生效：核心拉起桥时在握手的回应里交最终值，变了推 extension.config，桥照新的用。

[settings.listen]
type = "int"
min = 1024
max = 65535
default = 8301
layers = ["system"]
applies = "now"
name = { en = "Connect QQ port", zh = "接入QQ的端口", ja = "QQ接続のポート" }
description = { en = "The port NapCat's reverse WebSocket connects to, local only. In NapCat use ws://127.0.0.1:<port>/ws.", zh = "NapCat 反向 WebSocket 连进来的端口，只听本机。NapCat 那边的地址填 ws://127.0.0.1:<端口>/ws。", ja = "NapCat のリバース WebSocket が接続してくるポートです。このマシンからだけ受け付けます。NapCat 側のアドレスは ws://127.0.0.1:<ポート>/ws です。" }

[settings.web]
type = "int"
min = 1024
max = 65535
default = 8302
layers = ["system"]
applies = "now"
name = { en = "Connect QQ web port", zh = "接入QQ网页的端口", ja = "QQ接続の Web ページのポート" }
description = { en = "The port of Connect QQ's own web page (NapCat connection, token), local only. Open it with miyu-onebot web.", zh = "接入QQ自己的网页（连接 NapCat、换令牌）的端口，只听本机。用 miyu-onebot web 打开。", ja = "QQ接続自身の Web ページ（NapCat の接続、トークン）のポートです。このマシンからだけ受け付けます。miyu-onebot web で開きます。" }

[settings.token]
type = "secret"
layers = ["system"]
applies = "now"
name = { en = "Connect QQ token", zh = "接入QQ的令牌", ja = "QQ接続のトークン" }
description = { en = "The access token NapCat shows when it connects; set the same one in NapCat. Write { secret = \"name\" } (saved with miyu login) or { env = \"VARIABLE\" }. Without it Connect QQ still starts but refuses NapCat; you can generate one on Connect QQ web page. After a change, NapCat's next connection uses the new one.", zh = 'NapCat 连进来时要出示的访问令牌，NapCat 那边填同一个。写 { secret = "名字" }（用 miyu login 存）或 { env = "环境变量" }。没设的，接入QQ照样起来，NapCat 连进来会被拒；在接入QQ的网页上能生成一个。改了以后，NapCat 下一次连进来就照新的。', ja = 'NapCat が接続するときに示すアクセストークンです。NapCat 側にも同じものを設定します。{ secret = "名前" }（miyu login で保存）か { env = "環境変数" } を書きます。未設定でも QQ接続は起動しますが、NapCat の接続は拒否します。QQ接続の Web ページで生成できます。変えると、NapCat の次の接続から新しいものを使います。' }

[settings.trusted]
type = "list"
element = "text"
max = 128
layers = ["system"]
applies = "now"
name = { en = "Connect QQ friends", zh = "接入QQ的自己人", ja = "QQ接続の仲間" }
description = { en = 'People who can call her in private chat, with no rate limit, even while she sleeps: a list of platform identities, for example ["qq:20017"]. Edit it on Connect QQ web page. Connect QQ uses it once groups are connected.', zh = '私聊里能叫她、不限流、睡着时私聊也放行的人，写平台上的身份的列表，例如 ["qq:20017"]。在接入QQ的网页上改。接入QQ接通群以后才照它认人。', ja = '個人チャットで呼べて、回数制限がなく、寝ている間も個人チャットが通る人です。プラットフォーム上の ID のリストで書きます。例：["qq:20017"]。QQ接続の Web ページで変えます。QQ接続がグループにつながってから、これで人を見分けます。' }
