# QQ 桥的软件包清单（施工 O-18，docs/blueprint/onebot.md 第一条、packages.md）：核心照开关拉起桥、经标准输入输出说协议；
# miyu onebot … 转交给 miyu-onebot …。给人看的字，不发给模型。

[package]
kind = "process"
protocol = [1, 1]
name = { en = "QQ bridge", zh = "QQ 桥", ja = "QQ ブリッジ" }
summary = { en = "Talk with her on QQ through NapCat", zh = "经 NapCat 在 QQ 上和她说话", ja = "NapCat 経由で QQ で会話する" }

[command]
name = "onebot"
program = "miyu-onebot"
about = { en = "Start, stop and look at the QQ bridge", zh = "开、关、查看 QQ 桥", ja = "QQ ブリッジを起動・停止・確認する" }

[process]
args = ["serve"]
start = "manual"
