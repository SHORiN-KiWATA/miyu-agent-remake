[package]
name = "miyu-drivers"
description = "模型驱动的编码与解码：统一的请求和各家接口之间的翻译，纯逻辑"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[dependencies]
miyu-kernel = { path = "../miyu-kernel" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }

[features]
# 测试用的（施工 8-6）：DeepSeek 官方那一套开关 `Compat::deepseek()`。出厂的那一套住在供应商档案里；别的 crate 的测试
# 照它编码（请求形状探针、HTTP 执行器、会话），在自己的 dev-dependencies 里打开。
testkit = []

[dev-dependencies]
miyu-drivers = { path = ".", features = ["testkit"] }

[lints]
workspace = true

# 集成测试并成一个程序（施工 0-3 三补）；自己装日志订阅者的另列。
[[test]]
name = "all"
path = "tests/all.rs"
