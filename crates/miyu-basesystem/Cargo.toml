[package]
name = "miyu-basesystem"
description = "基础系统这个软件包：随发行附带、几乎每个预设都打开的几件工具（施工 4-4 起）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# 找文件的模式照 ripgrep 的 --glob 那一套（施工 4-4 下）：ripgrep 的作者拆出来的库，三个平台一样（B9）。
globset = "0.4"
# 搜内容：正则、按行搜、二进制跳过、前后行；和 ripgrep 是同一套（施工 4-4 下）。
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
# 找文件、搜内容往下走目录：遵守 .gitignore、.ignore（施工 4-4 下）。
ignore = "0.4"
# 碰文件：换成真实的位置、安全地打开（施工 4-3 上）；走目录时认出数据根（施工 4-4 下）。
miyu-fs = { path = "../miyu-fs" }
# 输出里给她看的几句是模板；参数格式是原样的 JSON；访问类别。
miyu-kernel = { path = "../miyu-kernel" }
# 工具的接口。
miyu-tool = { path = "../miyu-tool" }
# 读说明和参数格式、读参数。
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 读文件在阻塞线程里做，不占着跑异步任务的线程。
tokio = { version = "1", features = ["rt"] }
# edit 宽松那一层的 NFKC 规范化（施工 4-6 中）：Rust 里通用的那一个。
unicode-normalization = "0.1"
# 运行日志的门面：写文件时没删掉的临时文件记一条（施工 4-6 上）。
tracing = { version = "0.1", default-features = false, features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Linux 的回收站里记删的时间，要本地时间（施工 4-6 下）。
jiff = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# macOS 的回收站：系统的 NSFileManager 交回东西在回收站里的新位置（施工 4-6 下）。只开用到的几样。
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "FoundationErrors", "NSError", "NSFileManager", "NSString", "NSURL"] }

[target.'cfg(windows)'.dependencies]
# Windows 的回收站：系统的 IFileOperation，删完从回收站的列表里找回编号（施工 4-6 下）。
trash = "5"

[dev-dependencies]
# 核对工具会说的每一种，中文、英文都换得出字（施工 4-5 上）。
miyu-store = { path = "../miyu-store" }
# 测试里的调用在异步里跑。
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
