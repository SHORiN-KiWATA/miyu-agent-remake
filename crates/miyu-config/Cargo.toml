[package]
name = "miyu-config"
description = "配置清单：每一项只声明一次，从它生成 JSON Schema 和参考文件；纯逻辑，不碰磁盘（施工 8-1）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# 资源目录里给人看的字（`config` 那一格）照它读出来。
serde = { version = "1.0", features = ["derive"] }
# 生成 JSON Schema；值写成协议上的 JSON。
serde_json = "1.0"

[lints]
workspace = true
