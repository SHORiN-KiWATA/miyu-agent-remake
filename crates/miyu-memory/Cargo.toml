[package]
name = "miyu-memory"
description = "记忆这个软件包：她用来记、忘、搜自己的记忆的三件工具（施工 R-3 中，docs/blueprint/memory.md）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[dependencies]
# 工具的结果、给人看的说法、时刻和时区。
miyu-kernel = { path = "../miyu-kernel" }
# 工具的接口、读字、记忆的端口。
miyu-tool = { path = "../miyu-tool" }
# 记忆的编号、四类。
miyu-recall = { path = "../miyu-recall" }
# 她给的参数。
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
# 测试里跑工具的 future。
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true

# 集成测试并成一个程序（施工 0-3 三补）；自己装日志订阅者的另列。
[[test]]
name = "all"
path = "tests/all.rs"
