[package]
name = "miyu-store"
description = "存储的执行器：数据根、会话日志、blob，做真的 I/O"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# 事件、序号、账号、会话编号：会话日志一行一条事件（施工 3-2）。
miyu-kernel = { path = "../miyu-kernel" }
# 资源目录读出来的原文交给它拼策略快照（施工 3-6 上）。
miyu-policy = { path = "../miyu-policy" }
# blob 读一段：安全地打开以后读，`blob.get` 用（施工 W-6）。
miyu-fs = { path = "../miyu-fs" }
# 检索库的切词：存进 FTS5 的词、拼查询（施工 R-1，`recall.md`）。
miyu-recall = { path = "../miyu-recall" }
# 给人看的字里配置那一格照它的写法读，读好的字交给它生成文件（施工 8-1）。
miyu-config = { path = "../miyu-config" }
# 给人看的字一种语言一份 JSON（施工 4-5 上）。
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 配置文件的版本：整份字节的 SHA-256（施工 8-2）。
sha2 = { version = "0.11", default-features = false }
# 系统的语言：`LC_ALL`、`LC_MESSAGES`、`LANG` 都没设的，看 macOS、Windows 的系统设置（施工 8-2）。
sys-locale = "0.3"
# 监视配置文件（施工 8-4，`config.md` 第七条）：Linux 上 inotify、macOS 上 FSEvents、Windows 上 ReadDirectoryChangesW，
# 起不来的退回它自带的轮询。默认的功能只有 macOS 的 FSEvents。
notify = "8.2"
# 会话列表的索引（施工 3-8 七补，`07-存储.md` S3）：SQLite，`bundled` 自己带 SQLite 的源码编，三个平台一样。
rusqlite = { version = "0.40", features = ["bundled"] }
# 网页登录的密码哈希（施工 W-8，设计 06 U4）：argon2id，RustCrypto 的实现，MIT 或 Apache-2.0。盐由 getrandom 给。
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash"] }
getrandom = { version = "0.4", features = ["std"] }

[dev-dependencies]
# 测试里拿执行器替身跑一段真会话，写进日志、读回来、载入（施工 3-2）。
miyu-kernel = { path = "../miyu-kernel", features = ["testkit"] }
# 测试里拼工具的参数格式。
serde_json = { version = "1.0", features = ["raw_value"] }

[lints]
workspace = true
