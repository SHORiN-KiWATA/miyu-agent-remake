# 记忆的测评集的问句（施工 R-11，`docs/blueprint/memory/eval.md`）：大多照人在聊天里真会说的话写（联想拿的就是这一轮人说的
# 话），少数照她搜的时候写的关键词。
#
# 每条 `[[query]]`：`text`；`kind` 是六种之一：
#   keyword    和该想起的至少一条有两个字连着重合；
#   paraphrase 换了说法，和该想起的每一条都没有两个字连着重合；
#   chat       聊天里顺口说的、该带上某几条的；
#   cross      问句和该想起的不是同一种语言（也没有两个字连着重合）；
#   changed    问改过口的事：该想起新的，作废的旧说法不该出来；
#   none       平常的话，一条都不该想起。
# `expect` 是该想起的那几条的键：`none` 的是空的，别的不空，不许指作废的。

# —— keyword ——

[[query]]
text = "团子吃什么冻干"
kind = "keyword"
expect = ["cat-food"]

[[query]]
text = "我的日语老师叫什么"
kind = "keyword"
expect = ["japanese-teacher"]

[[query]]
text = "陈默是做什么的"
kind = "keyword"
expect = ["partner"]

[[query]]
text = "妈妈的高血压药"
kind = "keyword"
expect = ["mother-health"]

[[query]]
text = "记账小程序 仓库"
kind = "keyword"
expect = ["ledger-repo", "side-project"]

[[query]]
text = "GitHub 用户名"
kind = "keyword"
expect = ["github"]

[[query]]
text = "羽毛球一般什么时候打"
kind = "keyword"
expect = ["badminton"]

[[query]]
text = "N2 什么时候考"
kind = "keyword"
expect = ["japanese"]

[[query]]
text = "前端规范在哪看"
kind = "keyword"
expect = ["handbook"]

[[query]]
text = "厦门住的哪"
kind = "keyword"
expect = ["xiamen"]

