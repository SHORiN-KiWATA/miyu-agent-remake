[package]
name = "miyu-session"
description = "会话 actor：把内核的会话状态机接上磁盘，动作照表回（施工 3-7 中）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[dependencies]
# 驱动：请求编码成字节、读回来的分片解码（施工 3-7 下）。
miyu-drivers = { path = "../miyu-drivers" }
# HTTP 执行器：照编码好的字节发请求，流式读回来（施工 3-7 下）。
miyu-http = { path = "../miyu-http" }
# 会话的状态机、事件、编号。
miyu-kernel = { path = "../miyu-kernel" }
# 造会话时照人格拼策略快照，载入时照它重建（施工 3-6 上）。
miyu-policy = { path = "../miyu-policy" }
# 数据根、会话日志、blob、资源目录。
miyu-store = { path = "../miyu-store" }
# 回合索引怎么算（施工 R-2 上，`memory.md` 第一条）。
miyu-recall = { path = "../miyu-recall" }
# 工具目录：造会话时照它存下工具面（施工 4-1）。
miyu-tool = { path = "../miyu-tool" }
# 权限策略：换成真实的位置、查边界（施工 4-3 下）。
miyu-fs = { path = "../miyu-fs" }
# 执行器给每次调用写沙盒的规格（施工 5-4 上）。
miyu-sandbox = { path = "../miyu-sandbox" }
# 回合开始时冻结的配置是它合出来的最终值（施工 8-4，`config.md` 第八条第 3 条）。
miyu-config = { path = "../miyu-config" }
miyu-models = { path = "../miyu-models" }
# 权限策略提的放行规则、给头看的说明写成 JSON（施工 4-3 下）。
serde_json = "1.0"
# 理由见 docs/construction/3-7-会话actor（中）.md「我定的」：一个会话一个异步任务，收件箱、推送、
# 到点叫醒、写盘用的阻塞线程。
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
# 核对本机 embedding 的模型文件（施工 R-5 中，`embed/fetch.rs`）：和 miyu-store 用的同一个。
sha2 = { version = "0.11", default-features = false }
# 运行日志的门面（施工 3-7 上）：只发，写成什么样、写到哪是 miyu-log 的事。
tracing = { version = "0.1", default-features = false, features = ["std"] }
# 会话编号：UUIDv7，前 48 位是毫秒时间，随机数取自系统。
uuid = { version = "1", features = ["v7"] }

[features]
# 测试用的请求模型的端口（`src/testkit.rs`，施工 3-8 上）：别的 crate 的测试要用它，在自己的
# dev-dependencies 里打开；这个包自己的测试也经下面那一行打开。
testkit = []

[dev-dependencies]
# 测试用的假工具（施工 4-2）。
miyu-tool = { path = "../miyu-tool", features = ["testkit"] }
# 测试里用真的基础系统（施工 4-4 上）。
miyu-basesystem = { path = "../miyu-basesystem" }
# 测试里的工具目录带上记忆的三件（施工 R-3 中）。
miyu-memory = { path = "../miyu-memory" }
# 自己的集成测试用上剧本端口。
miyu-session = { path = ".", features = ["testkit"] }
# 测试里的假服务器：本机回环上的 HTTP/1.1（施工 3-7 下）。
miyu-http = { path = "../miyu-http", features = ["testkit"] }
# 测试里弄坏会话列表的索引（施工 3-8 七补）：和 miyu-store 用的是同一个。
rusqlite = { version = "0.40", features = ["bundled"] }
# 测试里接住发出来的日志，查写了什么、没写什么。
miyu-log = { path = "../miyu-log" }
# 测试里真的经助手起命令（施工 5-4 上）：cargo 编出来的助手在哪。
miyu-sandbox = { path = "../miyu-sandbox", features = ["testkit"] }
# 读记忆的测评集（施工 R-11，`tests/fixtures/memory-eval/`）：和 miyu-recall 读 TOML 用的同一个库、同一个版本。
serde = { version = "1.0", features = ["derive"] }
toml_edit = { version = "0.25", default-features = false, features = ["parse", "serde"] }

[lints]
workspace = true

# 集成测试并成一个程序（施工 0-3 三补）；自己装日志订阅者的另列。
[[test]]
name = "all"
path = "tests/all.rs"

