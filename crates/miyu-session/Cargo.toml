path = "tests/messages_log.rs"

[[test]]
name = "read_back_log"
path = "tests/read_back_log.rs"

[[test]]
name = "recap_log"
path = "tests/recap_log.rs"

[[test]]
name = "route_learned"
path = "tests/route_learned.rs"

