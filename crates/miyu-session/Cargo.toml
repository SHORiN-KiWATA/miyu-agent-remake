[package]
name = "miyu-session"
description = "会话 actor：把内核的会话状态机接上磁盘，动作照表回（施工 3-7 中）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# 驱动：请求编码成字节、读回来的分片解码（施工 3-7 下）。
miyu-drivers = { path = "../miyu-drivers" }
# HTTP 执行器：照编码好的字节发请求，流式读回来（施工 3-7 下）。
miyu-http = { path = "../miyu-http" }
# 会话的状态机、事件、编号。
miyu-kernel = { path = "../miyu-kernel" }
# 造会话时照人格拼策略快照，载入时照它重建（施工 3-6 上）。
miyu-policy = { path = "../miyu-policy" }
# 数据根、会话日志、blob、资源目录。
miyu-store = { path = "../miyu-store" }
# 工具目录：造会话时照它存下工具面（施工 4-1）。
miyu-tool = { path = "../miyu-tool" }
# 理由见 docs/construction/3-7-会话actor（中）.md「我定的」：一个会话一个异步任务，收件箱、推送、
# 到点叫醒、写盘用的阻塞线程。
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
# 运行日志的门面（施工 3-7 上）：只发，写成什么样、写到哪是 miyu-log 的事。
tracing = { version = "0.1", default-features = false, features = ["std"] }
# 会话编号：UUIDv7，前 48 位是毫秒时间，随机数取自系统。
uuid = { version = "1", features = ["v7"] }

[features]
# 测试用的请求模型的端口（`src/testkit.rs`，施工 3-8 上）：别的 crate 的测试要用它，在自己的
# dev-dependencies 里打开；这个包自己的测试也经下面那一行打开。
testkit = []

[dev-dependencies]
# 自己的集成测试用上剧本端口。
miyu-session = { path = ".", features = ["testkit"] }
# 测试里的假服务器：本机回环上的 HTTP/1.1（施工 3-7 下）。
miyu-http = { path = "../miyu-http", features = ["testkit"] }
# 测试里接住发出来的日志，查写了什么、没写什么。
miyu-log = { path = "../miyu-log" }
# 测试里的假工具：参数格式写成原样的 JSON（施工 4-1）。
serde_json = "1.0"

[lints]
workspace = true
