[package]
name = "miyu-ipc"
description = "本机传输：核心在套接字、命名管道上等连接，头连过去，本机令牌，一个数据根一个核心的锁（施工 3-8 下、补）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[dependencies]
# 本机令牌：32 个随机字节，取系统的随机数。
getrandom = { version = "0.4", features = ["std"] }
# 数据根：锁、令牌、套接字的位置都记在它的 `run/` 里；平台。
miyu-store = { path = "../miyu-store" }
# 数据根的指纹：路径的 SHA-256。
sha2 = { version = "0.11", default-features = false }
# 套接字是异步的：核心接连接、头连过去都不堵住别的任务。等核心说好了、等拉起锁，有时限（施工 3-9 上）。
tokio = { version = "1", features = ["net", "rt", "time"] }
# 运行日志的门面（施工 3-7 上）。
tracing = { version = "0.1", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
# 只对本人开放的命名管道，问出管道另一头是谁：要调 Windows 的安全接口，在放开了 unsafe 的小 crate 里（施工 3-8 补）。
miyu-pipe = { path = "../miyu-pipe" }
# 管道忙的时候歇一下再连。
tokio = { version = "1", features = ["net", "time"] }
# 管道忙的错误码；拉起的核心跟终端脱开。
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
# 有效用户编号：核对目录的属主、临时目录下的子目录起名。标准库里没有，它是不用 unsafe 的封装。
rustix = { version = "1", default-features = false, features = ["process"] }

[dev-dependencies]
# 测试里在套接字上收发、等待有时限。
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "time"] }

[lints]
workspace = true

# 集成测试并成一个程序（施工 0-3 三补）；自己装日志订阅者的另列。
[[test]]
name = "all"
path = "tests/all.rs"
