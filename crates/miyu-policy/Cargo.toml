[package]
name = "miyu-policy"
description = "策略快照：一个会话发请求要用的全部字和几样开关，按内容哈希存档（施工 3-6）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# 照快照造出组装器、驱动的占位。
miyu-assemble = { path = "../miyu-assemble" }
miyu-drivers = { path = "../miyu-drivers" }
# 内核的策略、事实模板、内核替工具写的几句、内容哈希。
miyu-kernel = { path = "../miyu-kernel" }
# 读「语言到一句话」那一格，和软件包清单共用（施工 9-1 上）。
miyu-config = { path = "../miyu-config" }
# 读人格的 `persona.toml`（施工 P-1 上），和配置同一个读法。
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
# 快照写成规范的 JSON、读回来。
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }

[lints]
workspace = true
