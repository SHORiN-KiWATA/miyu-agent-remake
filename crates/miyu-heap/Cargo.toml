[package]
name = "miyu-heap"
description = "进程的堆：glibc 上限制 arena 的个数、空闲时把空着的还给系统（23 F3，施工 V-2 再补）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Cargo 不许 `workspace = true` 以后再单改一条：这里照抄工作区的（改那边的，记得同步这里），只把 `unsafe_code` 从
# `forbid` 改成 `deny`：整个 crate 仍然不许，只有调 glibc 的两处单独放开，写明为什么安全（同 `miyu-sandbox`）。
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
missing_docs = "warn"

[lints.clippy]
let_underscore_must_use = "deny"
unused_result_ok = "deny"
unwrap_used = "deny"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
