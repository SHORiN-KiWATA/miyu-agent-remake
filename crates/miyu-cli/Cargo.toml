[package]
name = "miyu-cli"
description = "命令行的头：miyu ask，最薄的头，也是协议的参考实现（施工 3-9 下）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# 参数。
clap = { version = "4", features = ["derive"] }
# 请求编号的随机前缀：两次 miyu ask 不撞号。
getrandom = { version = "0.4", features = ["std"] }
# 连上核心，没在跑就拉起来（施工 3-8 下、3-9 上）。
miyu-ipc = { path = "../miyu-ipc" }
# 工具结果里给人看的说法（施工 4-5 下）。
miyu-kernel = { path = "../miyu-kernel" }
# 值写成 TOML：`miyu config get`、`explain` 印的值（施工 8-2）。
miyu-config = { path = "../miyu-config" }
# 数据根、环境快照；给人看的字。
miyu-store = { path = "../miyu-store" }
# `miyu sandbox setup`、`remove`：Windows 上装好、撤掉沙盒用户（施工 5-8）。
miyu-sandbox = { path = "../miyu-sandbox" }
# `miyu login` 贴 key 时关掉回显读一行（施工 8-5，`config.md` 第十一条第 4 条）：三个平台一份，读完照原样开回回显。
rpassword = "7.4"
# 协议是 JSON-RPC 2.0，一行一条（04-核心协议.md P1）。
serde_json = "1.0"
# 连接是异步的；Ctrl+C；`--timeout` 的钟（施工 7-9）。
tokio = { version = "1", features = ["io-util", "macros", "rt", "signal", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
# `miyu sandbox setup` 替谁装：当前用户的 SID（施工 5-8）。
miyu-pipe = { path = "../miyu-pipe" }

[dev-dependencies]
# 测试里在进程里起核心：照出厂档案造的路由（施工 8-6，没配模型时的端口）。
miyu-core = { path = "../miyu-core" }
# 测试里在进程里起核心：协议端点。
miyu-endpoint = { path = "../miyu-endpoint" }
# 测试里请求模型照剧本回。
miyu-session = { path = "../miyu-session", features = ["testkit"] }
# 测试里在进程里起核心：工具目录（施工 4-1）。
miyu-tool = { path = "../miyu-tool" }
# 测试里在进程里起核心：真的工具经 cargo 编出来的助手执行命令（施工 5-4 上）。
miyu-sandbox = { path = "../miyu-sandbox", features = ["testkit"] }
tokio = { version = "1", features = ["io-util", "macros", "rt", "signal", "sync", "time"] }

[lints]
workspace = true
