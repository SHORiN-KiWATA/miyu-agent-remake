[package]
name = "miyu-web"
description = "网页软件：只听本机的 HTTP 端口给页面文件，把浏览器的 WebSocket 转成核心协议，经本机传输连核心（施工 W-9，web-module.md）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[[bin]]
name = "miyu-web"
path = "src/main.rs"

[dependencies]
# 连核心：转发浏览器的连接不读本机令牌（connect_or_start_bare），`open` 要一次性码那一下照终端出示；拉起 `serve` 照
# 拉起核心的办法（spawn_detached），那一行照核心的写法（Ready）。
miyu-ipc = { path = "../miyu-ipc" }
# 数据根、资源目录在哪。
miyu-store = { path = "../miyu-store" }
# 读自己的清单 `packages/web.toml`：端口、空闲、票据那几项的默认值（施工 9-1 下）。
miyu-config = { path = "../miyu-config" }
# 运行日志 `state/logs/web.log`，满了照核心的换法。
miyu-log = { path = "../miyu-log" }
# 给页面、核对 Host 和 Origin、`/ws` 照转、照终端的样子连核心和开浏览器：和 QQ 桥的 WebUI 共用的底子（施工 O-16，
# webserve.md）。
miyu-webserve = { path = "../miyu-webserve" }
# HTTP/1 的服务端（「起草时定的」第 24 条：正式的软件不手写协议）。本来就在依赖图里（reqwest 带进来的）。MIT。
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
# `/media` 一块块给的正文是一条流。
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# `/media`（施工 W-10）：票据是 32 个随机字节；核心一块块给的是 base64。两个都本来就在依赖图里，和别的 crate 用的同一份。
getrandom = { version = "0.4", features = ["std"] }
base64 = "0.22"
# 读 web.json。
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[lints]
workspace = true

[dev-dependencies]
# 测试里照浏览器的样子连 `/ws`（客户端的握手）。
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

# 集成测试并成一个程序（施工 0-3 三补）；自己装日志订阅者的另列。
[[test]]
name = "all"
path = "tests/all.rs"
