[package]
name = "miyu-onebot"
description = "通讯平台的桥：经 OneBot v11 的反向 WebSocket 接 NapCat，把 QQ 上主人的私聊送进场所会话，把她的回复发回 QQ（施工 O-8，onebot.md）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[[bin]]
name = "miyu-onebot"
path = "src/main.rs"

[dependencies]
# WebUI 验登录令牌时经本机套接字连核心，没在跑就拉起来（`connect_or_start_bare`）。桥自己跟核心说话走核心给的标准输入
# 输出（施工 O-18），不用它。
miyu-ipc = { path = "../miyu-ipc" }
# 数据根；系统的语言；资源目录和给人看的字（`Human::load`）。
miyu-store = { path = "../miyu-store" }
# 运行日志 `state/logs/onebot.log`，满了照核心的换法。
miyu-log = { path = "../miyu-log" }
# WebUI（施工 O-16）：给页面、核对 Host 和 Origin、`/ws` 原样转给核心、照终端的样子连核心和开浏览器，和网页软件共用的底子
# （webserve.md）。
miyu-webserve = { path = "../miyu-webserve" }
# 给人看的字照说法换（`Said`，`Human::say`）；场所、平台上的人的编号是内核的 `VenueId`、`ExternalId`。
miyu-kernel = { path = "../miyu-kernel" }
# 群聊内核（第 2 层）：场所、平台上的人的编号经它拼，桥不手拼（`chat.md` 第七条第 1 条）。
miyu-chat = { path = "../miyu-chat" }
# 令牌是核心交来的密钥（`Debug` 只印 `Secret(…)`）；两个端口的默认值照自己的清单读（`miyu_config::package`，施工 O-20）。
# 配置由核心在握手时交、变了推过来，桥不依赖核心的 crate（`miyu-core`、`miyu-endpoint`，18 第一节）。
miyu-config = { path = "../miyu-config" }
# HTTP/1 的服务端：NapCat 反连进来的那一下是 HTTP 升级（照网页软件，本来就在依赖图里）。MIT。
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
# WebSocket：一帧一条 OneBot 的事件或动作。只开握手（算 Sec-WebSocket-Accept），连接由 hyper 升级好交给它。MIT。
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# 跟核心说的命令编号的随机前缀：桥重启以后不撞上一次的编号（`venue.session` 同一个编号交回上一次的那一个）。
getrandom = { version = "0.4", features = ["std"] }
# WebUI 的 `/status` 验过的登录令牌只记 SHA-256（和别的 crate 用的同一份，只开要的）。
sha2 = { version = "0.11", default-features = false }
# OneBot 和核心协议都是 JSON；读 `bridge.json`。
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `io-std`：`serve` 的标准输入输出是跟核心说协议的管道（施工 O-18）。
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "signal"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[lints]
workspace = true

[dev-dependencies]
# 测试里在进程里起一个真的核心：协议端点、请求模型照剧本回、读会话日志；配置清单照真核心起来时那样拼进出厂的包的配置项
# （`miyu_core::settings::Packaged`，施工 O-20）。不要核心的可选软件包。
miyu-core = { path = "../miyu-core", default-features = false }
miyu-endpoint = { path = "../miyu-endpoint" }
miyu-session = { path = "../miyu-session", features = ["testkit"] }
miyu-tool = { path = "../miyu-tool" }
# 测试里的假 NapCat 是一个 WebSocket 客户端（客户端的握手）。
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
# `process`：测试当核心跑真的 `serve`、`logs -f`（施工 O-18）。
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "test-util", "process"] }

# 集成测试并成一个程序（施工 0-3 三补）；自己装日志订阅者的另列。
[[test]]
name = "all"
path = "tests/all.rs"

# 陌生人的私聊只记一行运行日志（施工时定的第 49 条）：装着日志订阅者。
[[test]]
name = "stranger_log"
path = "tests/stranger_log.rs"
